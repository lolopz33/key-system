<!DOCTYPE html>
<html lang="pt-BR">
<head>


  <meta charset="UTF-8">
  <title>Protegido</title>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const permitido = "https://linkvertise.com";
      const ref = document.referrer;

      if (ref !== permitido) {
        // Bloqueia o acesso se não veio do link correto
        document.body.innerHTML = "<h1 style='color:red'>Acesso Negado</h1>";
        setTimeout(() => {
          window.location.href = "https://google.com"; // ou qualquer página de erro
        }, 2000);
      }
    });
  </script>
  <h1>Acesso Liberado</h1>
  <p>Você veio de uma origem permitida.</p>
</body>
</html>
