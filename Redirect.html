<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Verificação de Acesso</title>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const permitido = "https://linkvertise.com/1338065/s333-macro-for-asura?o=sharing";
      const ref = document.referrer;

      if (ref.startsWith(permitido)) {
        // Redireciona se a origem for permitida
        window.location.href = "https://24534greger534y-33oyhbc6w-lolsupzs-projects-2b8bd174.vercel.app";
      } else {
        // Bloqueia se não veio da origem correta
        document.body.innerHTML = "<h1 style='color:red'>Acesso Negado</h1><p>Você não tem permissão para acessar esta página.</p>";
        setTimeout(() => {
          window.location.href = "https://google.com";
        }, 2000);
      }
    });
  </script>
</head>
<body>

    <h1>JavaScript é necessário</h1>
    <p>Ative o JavaScript para continuar.</p>
  </noscript>
</body>
</html>
