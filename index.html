<!DOCTYPE html>
<html>
<head>
    <title>DeepSeek Submarine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <style>
        body { 
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #0af;
        }
        
        #vanta-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        #logo {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 2s infinite;
        }
        
        #terminal {
            position: absolute;
            bottom: 20px;
            width: 80%;
            height: 150px;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #0af;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #dashboard {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 200px;
            background: rgba(0, 10, 20, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #0ff;
        }
        
        .bubble {
            position: absolute;
            background: rgba(100, 200, 255, 0.6);
            border-radius: 50%;
            animation: rise linear infinite;
        }
        
        @keyframes rise {
            to { transform: translateY(-100vh); }
        }
        
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 5px #0ff); }
            50% { filter: drop-shadow(0 0 20px #0af); }
            100% { filter: drop-shadow(0 0 5px #0ff); }
        }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>
    
    <!-- Logo animado -->
    <div id="logo">
        <svg width="120" height="120" viewBox="0 0 100 100">
            <!-- Insira seu logo IA aqui -->
            <path d="..." fill="#0ff" />
        </svg>
    </div>
    
    <!-- Painel de indicadores -->
    <div id="dashboard">
        <h3>SUBMARINE SYSTEMS</h3>
        <div class="gauge">
            <div>Profundidade: <span id="depth">1520m</span></div>
            <progress value="70" max="100"></progress>
        </div>
        <div class="gauge">
            <div>Pressão: <span id="pressure">215 atm</span></div>
            <progress value="85" max="100"></progress>
        </div>
        <div class="status">
            Status: <span class="ok">OPERACIONAL</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill"></div>
        </div>
    </div>
    
    <!-- Terminal -->
    <div id="terminal">
        <div>> Sistema iniciado...</div>
        <div>> Conectando ao núcleo...</div>
        <div>> Analisando ambiente...</div>
        <div>> Pronto para mergulho profundo</div>
    </div>
    
    <!-- Controle de som -->
    <div id="sound-control">
        <button onclick="toggleSound()">🔊</button>
    </div>
    
    <script>
        // Configuração do Vanta.js (fundo subaquático)
        VANTA.NET({
            el: "#vanta-bg",
            color: 0x0088ff,
            backgroundColor: 0x001122,
            points: 12,
            maxDistance: 20,
            spacing: 15
        });
        
        // Criar bolhas
        function createBubbles() {
            for (let i = 0; i < 50; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 20 + 5;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.bottom = `${Math.random() * 100}vh`;
                bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
                document.body.appendChild(bubble);
            }
        }
        
        // Simular terminal
        function simulateTerminal() {
            const terminal = document.getElementById('terminal');
            const messages = [
                "> Coletando dados oceanográficos...",
                "> Detectando vida marinha...",
                "> Navegação autônoma ativada",
                "> Escaneamento 3D iniciado"
            ];
            
            setInterval(() => {
                const newMsg = messages[Math.floor(Math.random() * messages.length)];
                terminal.innerHTML += `<div>${newMsg}</div>`;
                terminal.scrollTop = terminal.scrollHeight;
            }, 3000);
        }
        
        // Animação de energia
        function energyPulse() {
            const bar = document.querySelector('.energy-fill');
            setInterval(() => {
                bar.style.width = `${Math.random() * 80 + 20}%`;
                bar.style.backgroundColor = `hsl(${Math.random() * 60 + 180}, 100%, 50%)`;
            }, 1000);
        }
        
        // Controle de som
        function toggleSound() {
            // Implementar áudio ambiente
            console.log("Som ambiente toggled");
        }
        
        // Inicialização
        window.onload = function() {
            createBubbles();
            simulateTerminal();
            energyPulse();
        };
    </script>
</body>
</html>
