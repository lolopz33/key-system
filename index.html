<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador Abissal de Keys</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Ubuntu+Mono&display=swap" rel="stylesheet"/>
  <style>
    /* [Manter todos os estilos anteriores] */
  </style>
</head>
<body>
  <!-- [Manter toda a estrutura HTML anterior] -->

  <script>
    // Configuração do Vanta.js (fundo subaquático profundo)
    VANTA.NET({
      el: "#vanta-bg",
      color: 0x0066ff,
      backgroundColor: 0x001133,
      points: 10,
      maxDistance: 15,
      spacing: 20,
      showDots: false
    });

    // Elementos da UI
    const btn = document.getElementById('generateBtn');
    const display = document.getElementById('keyDisplay');
    const loading = document.getElementById('loading');
    const clickSound = document.getElementById('sound-click');
    const deepSound = document.getElementById('sound-deep');
    const successSound = document.getElementById('sound-success');
    const errorSound = document.getElementById('sound-error');
    const alertBox = document.getElementById('alert');
    const alertMessage = document.getElementById('alert-message');

    // URL do Google Apps Script (modo de desenvolvimento)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyzXqI7BHsBgfH5KjlCSxlPoWBKoU7sKoVHL5HjkyqHMHH2prRmUunDRFlv4Wp955ww3g/exec';

    // Mostrar alerta
    function showAlert(message, isError = false) {
      alertMessage.textContent = message;
      alertBox.style.borderColor = isError ? '#f00' : '#0f0';
      alertBox.classList.add('show');
      
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 5000);
    }

    // Criar bolhas
    function createBubbles() {
      for (let i = 0; i < 30; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = Math.random() * 20 + 5;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}vw`;
        bubble.style.bottom = `-${size}px`;
        bubble.style.opacity = 0.3 + Math.random() * 0.5;
        bubble.style.animationDuration = `${Math.random() * 15 + 5}s`;
        bubble.style.animationDelay = `${Math.random() * 5}s`;
        document.body.appendChild(bubble);
      }
    }

    // Gerar key via API - Versão corrigida
    async function generateKey() {
      try {
        // Mostrar status inicial
        display.textContent = '>> INICIANDO PROCESSO...';
        
        // Primeiro estágio - preparação
        await new Promise(resolve => setTimeout(resolve, 800));
        display.textContent = '>> CONECTANDO AO SERVIDOR...';
        
        // Chamada à API com tratamento CORS
        const timestamp = new Date().getTime();
        const apiUrl = `${SCRIPT_URL}?action=generateKey&t=${timestamp}`;
        
        display.textContent = '>> AUTENTICANDO...';
        const response = await fetch(apiUrl, {
          method: 'GET',  // Alterado para GET para simplificar
          mode: 'no-cors', // Modo no-cors para evitar problemas
          cache: 'no-store'
        });
        
        // Tentar parsear a resposta mesmo em modo no-cors
        display.textContent = '>> PROCESSANDO RESPOSTA...';
        const textResponse = await response.text();
        
        let data;
        try {
          data = JSON.parse(textResponse);
        } catch (e) {
          // Se não for JSON válido, assumir que é a chave diretamente
          if (textResponse && textResponse.length > 10) {
            return textResponse;
          }
          throw new Error('Resposta inválida do servidor');
        }
        
        if (data && data.key) {
          return data.key;
        } else if (data && data.error) {
          throw new Error(data.error);
        } else {
          throw new Error('Resposta inesperada do servidor');
        }
      } catch (error) {
        console.error('Erro detalhado:', error);
        throw new Error(`Falha na comunicação: ${error.message}`);
      }
    }

    // Evento de geração - Versão robusta
    btn.addEventListener('click', async () => {
      try {
        // Resetar estado
        display.textContent = '>> INICIANDO...';
        loading.style.display = 'block';
        btn.disabled = true;
        
        // Efeitos sonoros
        clickSound.currentTime = 0;
        clickSound.play();
        deepSound.currentTime = 0;
        deepSound.volume = 0.3;
        deepSound.play();
        
        // Gerar a key
        const key = await generateKey();
        
        // Exibir resultado
        display.textContent = key;
        showAlert('Chave gerada com sucesso!', false);
        successSound.play();
      } catch (error) {
        console.error('Erro ao gerar key:', error);
        display.textContent = '>> FALHA: ' + error.message;
        showAlert(error.message, true);
        errorSound.play();
      } finally {
        loading.style.display = 'none';
        btn.disabled = false;
        
        // Fade out do som de profundidade
        let fadeInterval = setInterval(() => {
          if (deepSound.volume > 0.1) {
            deepSound.volume -= 0.05;
          } else {
            deepSound.pause();
            clearInterval(fadeInterval);
          }
        }, 100);
      }
    });

    // Inicialização
    window.onload = function() {
      createBubbles();
      
      // Ajustar volume dos sons
      if (soundAmbient) soundAmbient.volume = 0.3;
      if (deepSound) deepSound.volume = 0;
      
      // Mostrar instrução inicial
      setTimeout(() => {
        showAlert('Sistema pronto. Clique para gerar chave.', false);
      }, 2000);
    };
  </script>
</body>
</html>
