<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Keys Cósmicas</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      background: #000;
      color: #00ffee;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at bottom center, #020f1e, #000);
    }

    .container {
      position: relative;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 25px #00ffee;
      max-width: 500px;
      width: 90%;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #00ffff;
    }

    .key-display {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ffee;
      padding: 20px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 18px;
      color: #00ffff;
      margin: 20px 0;
      box-shadow: inset 0 0 15px #00ffee66;
    }

    .checkbox-container {
      color: #aaa;
      font-size: 14px;
      margin: 20px 0;
    }

    button {
      background: #00ffee;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px #00ffee;
    }

    button:hover {
      transform: scale(1.05);
      background: #00ffff;
      box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffee;
    }

    button:disabled {
      background: #555;
      color: #999;
      box-shadow: none;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    .loading {
      display: none;
      color: #aaa;
      margin-top: 10px;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="particles-js"></div>

<div class="container">
  <h1>🚀 Gerador de Keys Cósmicas</h1>
  <div class="key-display" id="keyDisplay">Clique abaixo para gerar sua key</div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Gerando key estelar...</p>
  </div>

  <div class="checkbox-container">
    <input type="checkbox" id="waitCheckbox" disabled>
    <label for="waitCheckbox">Espere 1 hora para gerar uma nova key</label>
  </div>

  <button id="generateBtn">✨ Gerar Nova Key</button>

  <div class="footer">© 2025 S333 HUBS — Viagem além do comum</div>
</div>

<!-- Sons -->
<audio id="sound-click" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="sound-success" src="https://assets.mixkit.co/sfx/preview/mixkit-game-level-completed-2059.mp3"></audio>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
  particlesJS("particles-js", {
    "particles": {
      "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
      "color": { "value": "#00ffff" },
      "shape": { "type": "circle" },
      "opacity": { "value": 0.4 },
      "size": { "value": 3 },
      "line_linked": { "enable": false },
      "move": {
        "enable": true,
        "speed": 1.5,
        "direction": "bottom",
        "out_mode": "out"
      }
    },
    "interactivity": {
      "events": {
        "onhover": { "enable": true, "mode": "repulse" }
      }
    },
    "retina_detect": true
  });

  document.addEventListener('DOMContentLoaded', () => {
    const generateBtn = document.getElementById('generateBtn');
    const keyDisplay = document.getElementById('keyDisplay');
    const waitCheckbox = document.getElementById('waitCheckbox');
    const loading = document.getElementById('loading');
    const clickSound = document.getElementById('sound-click');
    const successSound = document.getElementById('sound-success');

    async function generateKey() {
      clickSound.play();
      loading.style.display = 'block';
      generateBtn.disabled = true;

      const response = await callKeyGeneratorAPI();
      keyDisplay.textContent = response.key || 'KEY-GERADA';

      waitCheckbox.checked = true;

      successSound.play();

      setTimeout(() => {
        generateBtn.disabled = false;
        waitCheckbox.checked = false;
      }, 3600000); // 1 hora
      loading.style.display = 'none';
    }

    function callKeyGeneratorAPI() {
      return new Promise(resolve => {
        setTimeout(() => {
          const randomKey = 'KEY-' + Math.random().toString(36).substring(2, 10).toUpperCase()
                         + '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
          resolve({ key: randomKey });
        }, 1500);
      });
    }

    generateBtn.addEventListener('click', generateKey);
    waitCheckbox.addEventListener('change', function () {
      if (!generateBtn.disabled) this.checked = false;
    });
  });
</script>
</body>
</html>
