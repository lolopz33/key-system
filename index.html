<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador Subaquático de Keys</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      color: white;
    }

    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 20, 0.4);
      backdrop-filter: blur(8px);
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      margin: 10vh auto;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .key-display {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      font-size: 18px;
      font-family: monospace;
      color: #00ffff;
    }

    button {
      background: linear-gradient(45deg, #00c9ff, #92fe9d);
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      color: #003;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ffff;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #ccc;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div class="overlay"></div>

  <div class="container">
    <h1>Terminal Subaquático de Key</h1>

    <div class="key-display" id="keyDisplay">Clique abaixo para gerar sua chave.</div>

    <div class="spinner" id="loading" style="display: none;"></div>

    <button id="generateBtn">Gerar Key</button>

    <div class="footer">
      © 2025 S333 HUBS | Submerged Key Engine
    </div>
  </div>

  <audio id="sound-click" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_a6c9e21509.mp3?filename=click-124467.mp3"></audio>
  <audio id="sound-ambient" src="https://cdn.pixabay.com/download/audio/2022/03/28/audio_70294d7cf4.mp3?filename=underwater-ambience-6368.mp3" loop autoplay></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.21/dist/vanta.waves.min.js"></script>

  <script>
    VANTA.WAVES({
      el: "#background",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x003366,
      shininess: 50.00,
      waveHeight: 15.00,
      waveSpeed: 1.00,
      zoom: 1.2
    });

    const btn = document.getElementById('generateBtn');
    const display = document.getElementById('keyDisplay');
    const loading = document.getElementById('loading');
    const clickSound = document.getElementById('sound-click');

    btn.addEventListener('click', async () => {
      clickSound.play();
      loading.style.display = 'block';
      display.textContent = 'Gerando chave...';
      btn.disabled = true;

      await new Promise(resolve => setTimeout(resolve, 2000));
      const newKey = 'KEY-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      
      display.textContent = newKey;
      loading.style.display = 'none';
      btn.disabled = false;
    });
  </script>
</body>
</html>
