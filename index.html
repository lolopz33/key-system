<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S333 HUBS | Acesso Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-dark: #5649C0;
      --secondary: #00CEC9;
      --dark: #2D3436;
      --light: #F6F6F6;
      --gray: #CCCCCC;
      --success: #00B894;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0F2027, #203A43, #2C5364);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Loader */
    .circle-container {
      position: absolute;
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .circle {
      position: absolute;
      border: 4px solid transparent;
      border-radius: 50%;
      animation: rotate 1.5s linear infinite;
    }
    
    .circle:nth-child(1) {
      width: 60px;
      height: 60px;
      border-top-color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .circle:nth-child(2) {
      width: 40px;
      height: 40px;
      border-left-color: var(--secondary);
      border-right-color: var(--secondary);
      animation-duration: 1.2s;
      animation-direction: reverse;
    }
    
    .circle:nth-child(3) {
      width: 20px;
      height: 20px;
      border-top-color: var(--light);
      border-bottom-color: var(--light);
      animation-duration: 0.8s;
    }
    
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Container principal */
    .container-main-key {
      background: rgba(45, 52, 54, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      width: 90%;
      max-width: 500px;
      padding: 40px 30px;
      text-align: center;
      display: none;
      transform: scale(0.95);
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }
    
    @keyframes fadeIn {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
      color: var(--light);
      position: relative;
      display: inline-block;
    }
    
    h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: var(--secondary);
      border-radius: 3px;
    }
    
    /* Container da Key */
    .key-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      transition: all 0.3s ease;
    }
    
    .key-container:hover {
      border-color: rgba(0, 206, 201, 0.3);
      box-shadow: 0 0 0 3px rgba(0, 206, 201, 0.1);
    }
    
    #your-key {
      font-family: 'Inter', monospace;
      font-size: 18px;
      letter-spacing: 1px;
      font-weight: 600;
      color: var(--secondary);
      flex-grow: 1;
      text-align: center;
    }
    
    /* Ícone de copiar */
    #icon-copy {
      color: var(--gray);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #icon-copy:hover {
      color: var(--secondary);
      transform: scale(1.1);
    }
    
    /* Alerta de cópia */
    #alert-copy {
      position: fixed;
      top: 20px;
      right: -100%;
      background: var(--success);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: right 0.3s ease;
      z-index: 100;
    }
    
    #alert-copy.show {
      right: 20px;
    }
    
    /* Rodapé */
    footer {
      font-size: 12px;
      color: var(--gray);
      margin-top: 30px;
    }
    
    /* Responsividade */
    @media (max-width: 480px) {
      .container-main-key {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      #your-key {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  
  <!-- Loader -->
  <div class="circle-container">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
  
  <!-- Container Principal -->
  <div class="container-main-key">
    <main>
      <h1>Aqui está sua key</h1>
      <div class="key-container">
        <span id="your-key">xxxx-xxx</span>
        <i id="icon-copy" class="fa-solid fa-copy"></i>
      </div>
    </main>
    <footer>
      © 2025 S333 HUBS. Todos os direitos reservados.
    </footer>
  </div>

  <!-- Alerta de cópia -->
  <div id="alert-copy">
    <i class="fas fa-check-circle"></i> Key copiada!
  </div>

  <script>
    // Elementos DOM
    const containerCircle = document.querySelector(".circle-container")
    const containerMain = document.querySelector(".container-main-key")
    const yourKey = document.getElementById("your-key")
    const iconCopy = document.getElementById("icon-copy")
    const alertCopy = document.getElementById("alert-copy")
    
    // Copiar texto
    function copiarTexto(texto) {
      navigator.clipboard.writeText(texto)
      .then(() => {
        alertCopy.classList.add("show")
        setTimeout(() => {
          alertCopy.classList.remove("show")
        }, 2000)
      })
      .catch((err) => {
        console.error("Erro ao copiar:", err)
      })
    }
    
    // Buscar a key (mantendo sua URL original)
    fetch("https://script.google.com/macros/s/AKfycbyzXqI7BHsBgfH5KjlCSxlPoWBKoU7sKoVHL5HjkyqHMHH2prRmUunDRFlv4Wp955ww3g/exec")
    .then(response => response.text())
    .then(data => {
      containerCircle.style.display = "none"
      containerMain.style.display = "block"
      yourKey.textContent = data
    })
    .catch(error => {
      console.error("Erro ao buscar key:", error)
      containerCircle.style.display = "none"
      containerMain.style.display = "block"
      yourKey.textContent = "ERRO-AO-GERAR-KEY"
    })

    // Evento de cópia
    iconCopy.addEventListener("click", () => {
      iconCopy.style.color = "#F6F6F6"
      setTimeout(() => { iconCopy.style.color = "#CCCCCC" }, 200)
      copiarTexto(yourKey.textContent)
    })
  </script>
</body>
</html>
