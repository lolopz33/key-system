<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Keys Exclusivas</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      animation: fadeIn 1.2s ease-in-out;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #00e6e6;
      text-shadow: 0 0 10px #00e6e6;
    }

    .key-display {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #00e6e6;
      border-radius: 10px;
      padding: 20px;
      font-family: monospace;
      font-size: 18px;
      margin: 20px 0;
      color: #00ffff;
      word-break: break-all;
      box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      font-size: 14px;
      color: #ccc;
    }

    .checkbox-container input {
      margin-right: 10px;
      transform: scale(1.2);
    }

    button {
      background: #00e6e6;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 14px 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00e6e6;
    }

    button:hover {
      transform: scale(1.05);
      background: #00ffff;
    }

    button:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
      box-shadow: none;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }

    .loading {
      display: none;
      margin: 20px 0;
      color: #ccc;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Sua Key Exclusiva Chegou!</h1>

    <div class="key-display" id="keyDisplay">Clique no botão abaixo para gerar sua key</div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Gerando sua key...</p>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="waitCheckbox" disabled />
      <label for="waitCheckbox">Espere 1 hora para gerar uma nova key</label>
    </div>

    <button id="generateBtn">🔑 Gerar Nova Key</button>

    <div class="footer">© 2025 S333 HUBS. Todos os direitos reservados.</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const generateBtn = document.getElementById('generateBtn');
      const keyDisplay = document.getElementById('keyDisplay');
      const waitCheckbox = document.getElementById('waitCheckbox');
      const loading = document.getElementById('loading');

      async function generateKey() {
        try {
          loading.style.display = 'block';
          generateBtn.disabled = true;

          const response = await callKeyGeneratorAPI();

          keyDisplay.textContent = response.key || 'Key gerada com sucesso!';
          waitCheckbox.checked = true;

          setTimeout(() => {
            generateBtn.disabled = false;
            waitCheckbox.checked = false;
          }, 3600000);
        } catch (error) {
          console.error('Erro ao gerar key:', error);
          keyDisplay.textContent = 'Erro ao gerar key. Tente novamente.';
        } finally {
          loading.style.display = 'none';
        }
      }

      async function callKeyGeneratorAPI() {
        return new Promise(resolve => {
          setTimeout(() => {
            const randomKey = 'KEY-' + Math.random().toString(36).substring(2, 10).toUpperCase() +
              '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            resolve({ key: randomKey });
          }, 1500);
        });
      }

      generateBtn.addEventListener('click', generateKey);

      waitCheckbox.addEventListener('change', function () {
        if (!generateBtn.disabled) this.checked = false;
      });
    });
  </script>
</body>
</html>
